name: Lint

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Install shellcheck
        uses: taiki-e/install-action@v2
        with:
          tool: shellcheck
          fallback: none
      - name: Check shellcheck version
        run: shellcheck --version
      - name: Lint
        run: make lint
