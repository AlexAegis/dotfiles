name: Lint

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Install shellcheck and shfmt
        uses: taiki-e/install-action@v2
        with:
          tool: shellcheck,shfmt
          fallback: none
      - name: Check the tool versions
        run: |
          shellcheck --version
          shfmt --version
      - name: Lint
        run: make lint
      - name: Check the shell formatting
        if: ${{ !cancelled() }}
        run: make format-check
      - name: Install inotify-tools for the tests
        if: ${{ !cancelled() }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends inotify-tools
      - name: Test
        if: ${{ !cancelled() }}
        run: make test
