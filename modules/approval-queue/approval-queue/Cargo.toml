[package]
name = "approval-queue"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1.0.104"
ksni = { version = "0.3.7", default-features = false, features = ["async-io", "blocking"] }
ping_throttle = { git = "https://github.com/AlexAegis/ping_throttle" }
# unstable-rendered-line-info: Paragraph::line_count, for the count of the
# lines below the pane of the selected prompt
ratatui = { version = "0.30.2", default-features = false, features = [
    "crossterm",
    "unstable-rendered-line-info",
] }
rustix = { version = "1.1.6", features = ["net", "process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
syntect = { version = "5.3.0", default-features = false, features = ["default-syntaxes", "regex-fancy", "parsing"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# The library only serves the binaries of this package
missing_errors_doc = "allow"

[dev-dependencies]
tempfile = "3.27.0"
# The stand-in for the desktop service that takes tray icons, in the tests
zbus = { version = "5.19.0", default-features = false, features = ["async-io", "blocking-api"] }
